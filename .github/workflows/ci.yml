name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The whole workflow is offline with respect to application services: no
# repository secret is read, and the live smoke, migration, and deployment
# commands are deliberately not run here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Typecheck, unit tests, fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # pins 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Fixture check
        run: npm run check:fixtures

  build:
    name: Production build and secret scan (tracked files + built assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # pins 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must precede check:secrets, which scans .next/static and .next/server
      # in addition to the tracked files.
      - name: Production build (next build)
        run: npm run build

      - name: Secret scan of tracked files and built assets
        run: npm run check:secrets

  e2e:
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # pins 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only chromium, at the revision the pinned @playwright/test resolves to.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the app with `npm run start`, which serves
      # the build output, so the production build has to exist first.
      - name: Production build (next build)
        run: npm run build

      # The config overrides persistence with invalid sentinels, so this gate
      # needs no credential and reaches no external service.
      - name: Browser tests (Playwright)
        run: npm run test:e2e
