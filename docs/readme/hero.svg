<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d">
<title id="t">FirstPlayable — Choose the influences. Play the consequences.</title>
<desc id="d">The canonical saved comparison from a real FirstPlayable build. After the same two choices in the same room with the same Nia and the same letter, Return the letter is open without the Moon influence and locked with it; Moon adds two choices, Ask Nia who the other name belongs to and Examine the envelope closely. Qloo returned Moon, FirstPlayable proposed an interpretation, the creator edited and approved it, and the scene changed: 3 changed, 3 unchanged.</desc>
<style>
.serif{font-family:Georgia,'Times New Roman',Times,serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.label{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;font-weight:500;letter-spacing:.08em;fill:#6B6E75}
.it{font-style:italic}
.stock{fill:#F9E1E8;transform-box:fill-box;transform-origin:0 50%}
.ast{stroke:#B0154C;stroke-width:3.2;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 50%}
.unch{fill:#8B8E94;animation:quiet 14s linear infinite}
.ask{opacity:0;animation:ask 14s linear infinite}
.heads{animation:heads 14s linear infinite}
.divide{transform-box:fill-box;transform-origin:50% 0;animation:divide 14s cubic-bezier(.2,.7,.2,1) infinite}
.split{animation:split 14s linear infinite}
.sw1{animation:sw1 14s cubic-bezier(.2,.7,.2,1) infinite}.on1{animation:on1 14s linear infinite}
.sw2{animation:sw2 14s cubic-bezier(.2,.7,.2,1) infinite}.on2{animation:on2 14s linear infinite}
.sw3{animation:sw3 14s cubic-bezier(.2,.7,.2,1) infinite}.on3{animation:on3 14s linear infinite}
.press{animation:press 14s cubic-bezier(.3,1.6,.5,1) infinite}
.why{animation:why 14s linear infinite}
.chain{stroke-dasharray:500;animation:chain 14s cubic-bezier(.4,0,.2,1) infinite}
.c1{animation:c1 14s linear infinite}.c2{animation:c2 14s linear infinite}.c3{animation:c3 14s linear infinite}.c4{animation:c4 14s linear infinite}.c5{animation:c5 14s linear infinite}
.verdict{animation:verdict 14s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes quiet{0%,8%{fill:#141518}13%,96%{fill:#8B8E94}99.5%,100%{fill:#141518}}@keyframes ask{0%,7%{opacity:1}10%,96%{opacity:0}99.5%,100%{opacity:1}}@keyframes heads{0%,10%{opacity:0}14%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes divide{0%,9%{transform:scaleY(0)}14%,92%{transform:scaleY(1)}95.5%,100%{transform:scaleY(0)}}@keyframes split{0%,11%{opacity:0}15%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes sw1{0%,14%{transform:scaleX(0)}18%,92%{transform:scaleX(1)}95.5%,100%{transform:scaleX(0)}}@keyframes on1{0%,16%{opacity:0}19%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes sw2{0%,16%{transform:scaleX(0)}20%,92%{transform:scaleX(1)}95.5%,100%{transform:scaleX(0)}}@keyframes on2{0%,18%{opacity:0}21%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes sw3{0%,18%{transform:scaleX(0)}22%,92%{transform:scaleX(1)}95.5%,100%{transform:scaleX(0)}}@keyframes on3{0%,20%{opacity:0}23%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes press{0%,22%{opacity:0;transform:scale(.6)}25%,92%{opacity:1;transform:scale(1)}95.5%,100%{opacity:0;transform:scale(.6)}}@keyframes why{0%,25%{opacity:0}28%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes chain{0%,27%{stroke-dashoffset:500}54%,92%{stroke-dashoffset:0}95.5%,100%{stroke-dashoffset:500}}@keyframes c1{0%,27%{opacity:0}31%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes c2{0%,34%{opacity:0}38%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes c3{0%,41%{opacity:0}45%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes c4{0%,48%{opacity:0}52%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes c5{0%,52%{opacity:0}55%,92%{opacity:1}95.5%,100%{opacity:0}}@keyframes verdict{0%,57%{opacity:0;transform:translateY(6px)}62%,92%{opacity:1;transform:translateY(0)}95.5%,100%{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1280" height="800" fill="#F4F4F0"/>
<rect x=".5" y=".5" width="1279" height="799" fill="none" stroke="#D9D9D3"/>
<text x="48" y="37" class="serif" font-size="24" fill="#141518">FirstPlayable</text>
<text x="206" y="37" class="sans" font-size="14" fill="#6B6E75">/ saved example</text>
<rect x="888" y="16" width="352" height="30" fill="none" stroke="#141518" stroke-width="1.2" rx="2"/>
<text x="1064" y="36" class="label" text-anchor="middle" style="fill:#141518;font-size:12px">SAVED EXAMPLE · GENERATED FROM A REAL BUILD</text>
<line x1="0" y1="62" x2="1280" y2="62" stroke="#D9D9D3"/>
<text x="100" y="106" class="label">LOST-PROPERTY COUNTER · THE SECOND COPY</text>
<text x="96" y="166" class="serif" font-size="56" fill="#141518" letter-spacing="-1">Choose the influences.</text>
<text x="96" y="226" class="serif it" font-size="56" fill="#141518" letter-spacing="-1">Play the consequences.</text>
<text x="100" y="276" class="label">AFTER THE SAME CHOICES, IN BOTH VERSIONS</text>
<text x="100" y="304" class="serif it" font-size="20" fill="#3A3D43">Ask Nia why she needs it back → Examine the letter</text>
<g class="ask"><text x="100" y="340" class="label" style="fill:#141518">WHAT DO YOU DO?</text></g>
<g class="heads"><text x="100" y="340" class="label">WITHOUT THIS INFLUENCE</text><text x="488" y="340" class="label" style="fill:#141518">WITH MOON · YOU APPROVED</text></g>
<line x1="100" y1="352" x2="840" y2="352" stroke="#141518" stroke-width="1.5"/>
<g class=""><text x="66" y="383" class="mono" font-size="12" fill="#8B8E94">01</text></g>
<g class=""><line x1="100" y1="408" x2="840" y2="408" stroke="#D9D9D3"/></g>
<text x="100" y="387" class="serif unch" font-size="21">Promise to keep it safe while I hold it</text>
<g class=""><text x="66" y="439" class="mono" font-size="12" fill="#8B8E94">02</text></g>
<g class=""><line x1="100" y1="484" x2="840" y2="484" stroke="#D9D9D3"/></g>
<rect x="470" y="408" width="370" height="76" class="stock sw1"/>
<g class="press"><g class="ast"><line x1="34" y1="426" x2="34" y2="444"/><line x1="26.21" y1="430.5" x2="41.79" y2="439.5"/><line x1="41.79" y1="430.5" x2="26.21" y2="439.5"/></g></g>
<text x="100" y="437" class="serif" font-size="21" fill="#141518">Return the letter</text>
<g class="split"><text x="100" y="459" class="sans" font-size="14.5" fill="#3A3D43">Open · ends the scene: You returned the letter</text></g>
<g class="on1"><text x="488" y="437" class="serif" font-size="21" fill="#8C0F3B">Return the letter</text><text x="488" y="459" class="sans" font-size="14.5" fill="#B0154C">Locked · needs: ask Nia who the other name</text><text x="488" y="476" class="sans" font-size="14.5" fill="#B0154C">belongs to, and examine the envelope closely</text></g>
<g class=""><text x="66" y="515" class="mono" font-size="12" fill="#8B8E94">03</text></g>
<g class=""><line x1="100" y1="540" x2="840" y2="540" stroke="#D9D9D3"/></g>
<text x="100" y="519" class="serif unch" font-size="21">Keep the letter</text>
<g class=""><text x="66" y="571" class="mono" font-size="12" fill="#8B8E94">04</text></g>
<g class=""><line x1="100" y1="596" x2="840" y2="596" stroke="#D9D9D3"/></g>
<text x="100" y="575" class="serif unch" font-size="21">Walk away for now</text>
<g class="split"><text x="66" y="627" class="mono" font-size="12" fill="#8B8E94">05</text></g>
<g class="split"><line x1="100" y1="656" x2="840" y2="656" stroke="#D9D9D3"/></g>
<rect x="470" y="596" width="370" height="60" class="stock sw2"/>
<g class="press"><g class="ast"><line x1="34" y1="614" x2="34" y2="632"/><line x1="26.21" y1="618.5" x2="41.79" y2="627.5"/><line x1="41.79" y1="618.5" x2="26.21" y2="627.5"/></g></g>
<g class="split"><text x="100" y="625" class="serif" font-size="20" fill="#B4B6BA">—</text><text x="100" y="645" class="sans" font-size="14.5" fill="#6B6E75">Not in this version</text></g>
<g class="on2"><text x="488" y="625" class="serif" font-size="19" fill="#8C0F3B">Ask Nia who the other name belongs to</text><text x="488" y="645" class="sans" font-size="14.5" fill="#B0154C">Added with Moon · open now</text></g>
<g class="split"><text x="66" y="687" class="mono" font-size="12" fill="#8B8E94">06</text></g>
<g class="split"><line x1="100" y1="716" x2="840" y2="716" stroke="#D9D9D3"/></g>
<rect x="470" y="656" width="370" height="60" class="stock sw3"/>
<g class="press"><g class="ast"><line x1="34" y1="674" x2="34" y2="692"/><line x1="26.21" y1="678.5" x2="41.79" y2="687.5"/><line x1="41.79" y1="678.5" x2="26.21" y2="687.5"/></g></g>
<g class="split"><text x="100" y="685" class="serif" font-size="20" fill="#B4B6BA">—</text><text x="100" y="705" class="sans" font-size="14.5" fill="#6B6E75">Not in this version</text></g>
<g class="on3"><text x="488" y="685" class="serif" font-size="19" fill="#8C0F3B">Examine the envelope closely</text><text x="488" y="705" class="sans" font-size="14.5" fill="#B0154C">Added with Moon · open now</text></g>
<line x1="470" y1="408" x2="470" y2="484" stroke="#D9D9D3" class="divide"/>
<line x1="470" y1="596" x2="470" y2="656" stroke="#D9D9D3" class="divide"/>
<line x1="470" y1="656" x2="470" y2="716" stroke="#D9D9D3" class="divide"/>
<g class="verdict"><text x="100" y="756" class="serif" font-size="30"><tspan fill="#B0154C">3 changed</tspan><tspan fill="#8B8E94"> · 3 unchanged</tspan></text><text x="100" y="782" class="label">SAME ROOM · SAME NIA · SAME LETTER · SAME TWO CHOICES</text></g>
<g class="why"><text x="888" y="106" class="label" style="fill:#B0154C">WHY THIS CHANGED</text><text x="1240" y="106" class="mono" text-anchor="end" font-size="12" fill="#6B6E75">lines 02 · 05 · 06</text><line x1="888" y1="118" x2="1240" y2="118" stroke="#D9D9D3"/></g>
<line x1="874" y1="140" x2="874" y2="634" stroke="#B4B6BA" stroke-width="1" class="chain"/>
<g class="c1"><circle cx="874" cy="142" r="3.5" fill="#141518"/><text x="888" y="146" class="label">1 · SOURCE · QLOO RETURNED</text><rect x="888" y="158" width="352" height="130" fill="#FBFBF9" stroke="#D9D9D3" rx="2"/><text x="902" y="186" class="mono" font-size="18" font-weight="600" fill="#141518">Moon</text><text x="1226" y="185" class="mono" text-anchor="end" font-size="13" fill="#6B6E75">film · 2009 · Duncan Jones</text><text x="902" y="208" class="mono" font-size="13" fill="#3A3D43">#3 of the films returned for</text><text x="902" y="225" class="mono" font-size="13" fill="#3A3D43">Radiohead, the artist you confirmed</text><line x1="902" y1="234" x2="1226" y2="234" stroke="#D9D9D3" stroke-dasharray="3 3"/><text x="902" y="258" class="mono" font-size="13" fill="#6B6E75">theme · “…exploring identity and</text><text x="902" y="275" class="mono" font-size="13" fill="#6B6E75">memory under extreme isolation…”</text></g>
<g class="c2"><circle cx="874" cy="316" r="3.5" fill="#6B6E75"/><text x="888" y="320" class="label">2 · SUGGESTION · FIRSTPLAYABLE PROPOSED</text><text x="888" y="346" class="serif it" font-size="15.5" fill="#6B6E75">Examine the themes of memory and identity</text><text x="888" y="367" class="serif it" font-size="15.5" fill="#6B6E75">under pressure, reflected in the sealed letter…</text><line x1="888" y1="351" x2="1210" y2="351" stroke="#B4B6BA" stroke-dasharray="2 3"/><line x1="888" y1="372" x2="1232" y2="372" stroke="#B4B6BA" stroke-dasharray="2 3"/></g>
<g class="c3"><circle cx="874" cy="406" r="3.5" fill="#141518"/><text x="888" y="410" class="label" style="fill:#141518">3 · DECISION · YOU EDITED, THEN APPROVED</text><rect x="888" y="424" width="2" height="128" fill="#141518"/><text x="902" y="444" class="serif" font-size="16" fill="#141518">Borrow the idea of a contradictory</text><text x="902" y="464" class="serif" font-size="16" fill="#141518">identity, not the film's plot. The</text><text x="902" y="484" class="serif" font-size="16" fill="#141518">envelope is addressed to two names:</text><text x="902" y="504" class="serif" font-size="16" fill="#141518">Nia's, and someone else's. Returning</text><text x="902" y="524" class="serif" font-size="16" fill="#141518">the letter stays locked until you ask</text><text x="902" y="544" class="serif" font-size="16" fill="#141518">Nia who the other name belongs to.</text></g>
<g class="c4"><circle cx="874" cy="580" r="3.5" fill="#B0154C"/><text x="888" y="584" class="label" style="fill:#B0154C">4 · CONSEQUENCE · THE SCENE CHANGED</text><rect x="888" y="596" width="352" height="102" fill="#F9E1E8" rx="2"/><text x="902" y="621" class="serif" font-size="16" fill="#8C0F3B">After the same two choices, Return the</text><text x="902" y="641.5" class="serif" font-size="16" fill="#8C0F3B">letter is locked with Moon and open</text><text x="902" y="662" class="serif" font-size="16" fill="#8C0F3B">without it. Moon added two choices, and</text><text x="902" y="682.5" class="serif" font-size="16" fill="#8C0F3B">Return needs both.</text></g>
<g class="c5"><text x="888" y="730" class="sans" font-size="13.5" fill="#6B6E75">Qloo supplied the reference. The interpretation</text><text x="888" y="749" class="sans" font-size="13.5" fill="#6B6E75">is yours. The scene's own check confirmed the change.</text></g>
</svg>
